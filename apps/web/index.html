<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f3" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Casa</title>
    <script>
      // Apply the saved light/dark mode before first paint (no flash). Mirrors src/lib/theme.tsx.
      ;(function () {
        var mode = 'system'
        try {
          var saved = JSON.parse(localStorage.getItem('spendly.theme') || '{}')
          if (saved.mode === 'light' || saved.mode === 'dark') mode = saved.mode
        } catch (e) {}
        var dark =
          mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
