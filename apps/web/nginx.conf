# Static web build behind Caddy. Caddy terminates TLS and forwards /api/* to the API,
# so everything that reaches here is a file request or an app route.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The hashed assets of a build never change; a new deploy produces new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a browser keeps asking for the chunks of an
    # old build after a deploy and the app breaks on the first navigation.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: a real file wins, anything else is a route for the router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
